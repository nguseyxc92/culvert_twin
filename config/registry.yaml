  - {id: N2, name: "Jemo 2/3",     lat: 8.9391, lon: 38.7182, z_up: 2210, z_down: 2192, length_m: 2250, slope_registry: 0.0080, area_ha: 65.0, C: 0.85, culvert_class: "Twin/Wide Box Culvert", B_m: 1.80, H_m: 1.40, n: 0.015}
  - {id: N3, name: "German Sq.",   lat: 8.9284, lon: 38.7290, z_up: 2192, z_down: 2183, length_m: 2000, slope_registry: 0.0045, area_ha: 42.0, C: 0.82, culvert_class: "Single Box Culvert", B_m: 1.50, H_m: 1.20, n: 0.015}
  - {id: N4, name: "Lancha outlet",lat: 8.9195, lon: 38.7412, z_up: 2183, z_down: 2172, length_m: 2000, slope_registry: 0.0055, area_ha: 58.0, C: 0.78, culvert_class: "Double Trunk Box Culvert", B_m: 2.00, H_m: 1.50, n: 0.015}
